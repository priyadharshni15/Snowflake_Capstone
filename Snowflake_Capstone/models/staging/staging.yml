version: 2
models:
  - name: stg_account
    description: "Staged account data with cleaned column names"
    columns:
      - name: account_id
        tests:
          - not_null
          - unique

  - name: stg_holdings
    description: "Staged holdings snapshot data"
    columns:
      - name: account_id
        tests:
          - not_null
      - name: as_of_timestamp
        tests:
          - not_null

  - name: stg_model
    description: "Staged investment model data"
    columns:
      - name: model_id
        tests:
          - not_null
          - unique
