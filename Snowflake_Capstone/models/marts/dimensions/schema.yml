version: 2

models:
  - name: dim_combined_data
    description: "Combined dimension table containing account, model, and holdings information"

    columns:
      - name: account_id
        description: "Unique identifier for account"
        tests:
          - not_null

      - name: model_code
        description: "Model code assigned to account"
        tests:
          - not_null

      - name: model_name
        description: "Name of the investment model"

      - name: strategist_id
        description: "Strategist responsible for model"

      - name: custodian_code
        description: "Custodian identifier"

      - name: advisor_id
        description: "Advisor managing the account"

      - name: ticker
        description: "Security ticker"

      - name: shares
        description: "Number of shares held"

      - name: market_value
        description: "Market value of the holding"

      - name: as_of_timestamp
        description: "Date of holdings snapshot"
        tests:
          - not_null


  - name: dim_sharesum
    description: "Aggregated shares per account and ticker using macro logic"

    columns:
      - name: account_id
        description: "Account identifier"
        tests:
          - not_null

      - name: ticker
        description: "Security ticker"
        tests:
          - not_null

      - name: total_shares
        description: "Total shares held for each ticker"


  - name: dim_model
    description: "Model dimension containing strategist details"

    columns:
      - name: model_id
        description: "Unique identifier for model"
        tests:
          - not_null
          - unique

      - name: strategist_id
        description: "Strategist responsible for the model"
        tests:
          - not_null